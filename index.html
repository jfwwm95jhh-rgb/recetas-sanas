<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2c400">
<title>RECETAS SANAS</title>

<style>
:root{
  --yellow:#f2c400;
  --ink:#171717;
  --muted:#777;
  --line:#d8d8d8;
  --bg:#f7f7f5;
  --white:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif
}

button,input,textarea,select{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}

.app{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding:22px 18px 110px
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:4px solid var(--ink);
  padding-bottom:14px
}

.brand{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1.5px;
  line-height:.9
}

.brand span{
  display:block;
  font-size:18px;
  letter-spacing:1px
}

.icon{
  font-size:26px;
  font-weight:900;
  padding:4px 8px
}

.search{
  margin:20px 0 12px;
  border:3px solid var(--ink);
  background:white;
  padding:14px 16px;
  font-weight:700;
  width:100%;
  outline:none
}

.filter-title{
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  margin:12px 0 6px
}

.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 12px
}

.chip{
  white-space:nowrap;
  border:2px solid var(--ink);
  padding:8px 12px;
  background:white;
  font-weight:800
}

.chip.on{background:var(--yellow)}

.section{margin-top:18px}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px
}

.section-title{
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px
}

.count{
  font-weight:900;
  color:var(--muted)
}

.card{
  background:white;
  border:2px solid var(--ink);
  padding:14px;
  margin-bottom:10px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px
}

.card h3{
  margin:0 0 7px;
  font-size:20px
}

.meta{
  font-size:12px;
  font-weight:800;
  color:#666;
  text-transform:uppercase
}

.fav{
  font-size:25px
}

.draftbar{
  height:9px;
  background:#ddd;
  margin-top:9px
}

.draftbar i{
  display:block;
  height:100%;
  background:var(--yellow)
}

.fab{
  position:fixed;
  right:20px;
  bottom:82px;
  background:var(--yellow);
  border:3px solid var(--ink);
  width:62px;
  height:62px;
  font-size:36px;
  font-weight:900;
  box-shadow:4px 4px 0 var(--ink);
  z-index:7
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:3px solid var(--ink);
  display:flex;
  z-index:8
}

.nav button{
  flex:1;
  min-height:68px;
  padding:12px 4px;
  font-size:12px;
  font-weight:900
}

.nav button.on{background:var(--yellow)}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:20;
  display:flex;
  align-items:flex-end
}

.sheet{
  background:var(--bg);
  width:100%;
  max-width:700px;
  margin:auto;
  padding:24px 18px 30px;
  border:3px solid var(--ink);
  max-height:92vh;
  overflow:auto
}

.sheet h2{margin:0 0 18px;font-size:27px}

.field{margin:14px 0}

.field label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:2px solid var(--ink);
  background:white;
  padding:12px;
  outline:none
}

.field textarea{min-height:100px}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
  flex-wrap:wrap
}

.btn{
  border:2px solid var(--ink);
  padding:12px 15px;
  font-weight:900;
  background:white
}

.btn.primary{background:var(--yellow)}

.empty{
  text-align:center;
  padding:45px 15px;
  color:#666;
  font-weight:800
}

.step{
  display:flex;
  gap:6px;
  margin-bottom:18px;
  align-items:center
}

.step b{
  background:var(--ink);
  color:white;
  padding:7px 10px
}

.step span{
  font-weight:900;
  letter-spacing:1px
}

.ingredient{
  display:grid;
  grid-template-columns:80px 100px 1fr 38px;
  gap:6px;
  margin-bottom:8px
}

.ingredient input,
.ingredient select{
  border:2px solid var(--ink);
  padding:9px;
  background:white;
  width:100%
}

.recipe-img{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border:2px solid var(--ink);
  margin-bottom:15px
}

.detail h1{
  font-size:34px;
  line-height:.95;
  margin:5px 0 10px
}

.yellowbox{
  background:var(--yellow);
  border:2px solid var(--ink);
  padding:13px;
  margin:12px 0;
  font-weight:900
}

.detail ul{padding-left:20px}
.detail li{margin:8px 0}

.locked{
  border:2px dashed var(--ink);
  padding:12px;
  background:#fff
}

.user-badge{
  display:inline-block;
  background:var(--yellow);
  border:2px solid var(--ink);
  padding:5px 8px;
  font-size:11px;
  font-weight:900
}

.custom-unit{
  display:none;
  margin-top:6px
}

.custom-unit.show{display:block}

@media(min-width:700px){
  .app{padding:30px 34px 120px}
  .overlay{align-items:center}
  .sheet{border:3px solid var(--ink)}
}
</style>
</head>

<body>
<div id="root"></div>

<script>
/* =========================================================
   DATOS
========================================================= */

const DEFAULT_CATS={
  momento:[
    "DESAYUNO",
    "ALMUERZO",
    "COMIDA",
    "MERIENDA",
    "CENA",
    "POSTRE"
  ],
  tipo:[
    "ENSALADA",
    "PASTA",
    "ARROZ",
    "LEGUMBRES",
    "SOPA / CREMA",
    "CARNE",
    "PESCADO",
    "MARISCO",
    "HUEVOS",
    "VERDURAS",
    "PIZZA",
    "BOCADILLOS",
    "ENTRANTES",
    "GUARNICIONES",
    "POSTRES",
    "REPOSTERÍA"
  ],
  car:[
    "SALUDABLE",
    "RÁPIDA",
    "ALTA EN PROTEÍNA",
    "VEGETARIANA",
    "VEGANA",
    "ECONÓMICA",
    "PARA INVITADOS"
  ]
};

const units=[
  "g",
  "kg",
  "ml",
  "l",
  "unidad",
  "cucharadita",
  "cucharada",
  "pizca",
  "al gusto",
  "otra"
];

let categories=JSON.parse(
  localStorage.getItem("rs_categories") ||
  JSON.stringify(DEFAULT_CATS)
);

let users=JSON.parse(
  localStorage.getItem("rs_users") ||
  JSON.stringify(["ALEX","MARTA"])
);

let recipes=JSON.parse(
  localStorage.getItem("rs_recipes") || "[]"
);

let drafts=JSON.parse(
  localStorage.getItem("rs_drafts") || "[]"
);

let list=JSON.parse(
  localStorage.getItem("rs_list") || "[]"
);

let trash=JSON.parse(
  localStorage.getItem("rs_trash") || "[]"
);

let page="recipes";
let query="";
let mealFilter="";
let foodFilter="";
let editing=null;
let step=1;

/* =========================================================
   UTILIDADES
========================================================= */

function save(){
  localStorage.setItem("rs_recipes",JSON.stringify(recipes));
  localStorage.setItem("rs_drafts",JSON.stringify(drafts));
  localStorage.setItem("rs_list",JSON.stringify(list));
  localStorage.setItem("rs_trash",JSON.stringify(trash));
  localStorage.setItem("rs_users",JSON.stringify(users));
  localStorage.setItem("rs_categories",JSON.stringify(categories));
}

function esc(s=""){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function allCategories(){
  return [
    ...categories.momento,
    ...categories.tipo,
    ...categories.car
  ];
}

function formatQty(n){
  if(n==="" || n===null || n===undefined)return "";
  const num=Number(n);
  if(Number.isNaN(num))return String(n);
  return Number.isInteger(num)
    ? num
    : Math.round(num*100)/100;
}

function uid(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
}

/* =========================================================
   NAVEGACIÓN
========================================================= */

function nav(){
  return `
  <nav class="nav">
    <button class="${page==="recipes"?"on":""}"
      onclick="page='recipes';render()">
      🍴<br>RECETAS
    </button>

    <button class="${page==="favorites"?"on":""}"
      onclick="page='favorites';render()">
      ♡<br>FAVORITAS
    </button>

    <button class="${page==="list"?"on":""}"
      onclick="page='list';render()">
      🛒<br>LISTA
    </button>
  </nav>`;
}

/* =========================================================
   INICIO
========================================================= */

function render(){
  const root=document.getElementById("root");

  if(page==="detail"){
    renderDetail(root,editing);
    return;
  }

  if(page==="list"){
    renderList(root);
    return;
  }

  if(page==="settings"){
    renderSettings(root);
    return;
  }

  if(page==="favorites"){
    renderFavorites(root);
    return;
  }

  renderRecipes(root);
}

function renderRecipes(root){

  let filtered=recipes.filter(r=>{

    const text=JSON.stringify(r).toLowerCase();

    const searchOK=
      !query ||
      text.includes(query.toLowerCase());

    const mealOK=
      !mealFilter ||
      r.categories.includes(mealFilter);

    const foodOK=
      !foodFilter ||
      r.categories.includes(foodFilter) ||
      r.ingredients.some(i=>
        String(i.name||"").toLowerCase()
        .includes(foodFilter.toLowerCase())
      );

    return searchOK && mealOK && foodOK;
  });

  const foodsAvailable=mealFilter
    ? getFoodsForMeal(mealFilter)
    : [];

  root.innerHTML=`
  <main class="app">

    <header class="top">
      <div class="brand">
        RECETAS
        <span>SANAS</span>
      </div>

      <button class="icon"
        onclick="page='settings';render()">
        ⚙
      </button>
    </header>

    <input
      class="search"
      placeholder="BUSCAR RECETAS O INGREDIENTES"
      value="${esc(query)}"
      oninput="query=this.value;render()">

    <div class="filter-title">MOMENTO DEL DÍA</div>

    <div class="chips">
      ${categories.momento.map(c=>`
        <button
          class="chip ${mealFilter===c?"on":""}"
          onclick="selectMeal('${esc(c)}')">
          ${esc(c)}
        </button>
      `).join("")}
    </div>

    ${mealFilter ? `
      <div class="filter-title">
        ALIMENTO / TIPO
      </div>

      <div class="chips">
        ${foodsAvailable.length
          ? foodsAvailable.map(c=>`
              <button
                class="chip ${foodFilter===c?"on":""}"
                onclick="selectFood('${esc(c)}')">
                ${esc(c)}
              </button>
            `).join("")
          : `<span class="meta">NO HAY ALIMENTOS PARA ESTE MOMENTO</span>`
        }
      </div>
    `:""}

    ${drafts.length ? `
      <section class="section">
        <div class="section-head">
          <div class="section-title">
            BORRADORES — ${drafts.length}
          </div>
        </div>

        ${drafts.map(d=>`
          <button
            class="card"
            style="width:100%;text-align:left"
            onclick="openDraft('${d.id}')">

            <div>
              <h3>${esc(d.name||"RECETA SIN TÍTULO")}</h3>

              <div class="draftbar">
                <i style="width:${d.progress||20}%"></i>
              </div>
            </div>

            <b>${d.progress||20}%</b>
          </button>
        `).join("")}
      </section>
    `:""}

    <section class="section">

      <div class="section-head">
        <div class="section-title">RECETAS</div>
        <div class="count">${filtered.length}</div>
      </div>

      ${
        filtered.length
        ? filtered.map(r=>`
          <button
            class="card"
            style="width:100%;text-align:left"
            onclick="openRecipe('${r.id}')">

            <div>
              <h3>${esc(r.name)}</h3>

              <div class="meta">
                ${esc(r.categories.join(" · "))}
                · ${r.time} MIN
                · ${esc(r.difficulty)}
              </div>

              ${r.user
                ? `<div style="margin-top:8px">
                    <span class="user-badge">${esc(r.user)}</span>
                  </div>`
                :""
              }
            </div>

            <button
              class="fav"
              onclick="event.stopPropagation();toggleFavorite('${r.id}')">
              ${r.favorite?"♥":"♡"}
            </button>
          </button>
        `).join("")
        : `<div class="empty">NO HAY RECETAS</div>`
      }

    </section>

    <button class="fab" onclick="newMenu()">+</button>

    ${nav()}

  </main>`;
}

function getFoodsForMeal(meal){

  const found=new Set();

  recipes
    .filter(r=>r.categories.includes(meal))
    .forEach(r=>{

      r.categories.forEach(c=>{
        if(
          !categories.momento.includes(c) &&
          c!=="SALUDABLE" &&
          c!=="RÁPIDA" &&
          c!=="ECONÓMICA" &&
          c!=="PARA INVITADOS" &&
          c!=="VEGETARIANA" &&
          c!=="VEGANA" &&
          c!=="ALTA EN PROTEÍNA"
        ){
          found.add(c);
        }
      });

      r.ingredients.forEach(i=>{
        if(i.name){
          found.add(i.name.toUpperCase());
        }
      });
    });

  return [...found].sort();
}

function selectMeal(c){
  if(mealFilter===c){
    mealFilter="";
    foodFilter="";
  }else{
    mealFilter=c;
    foodFilter="";
  }

  render();
}

function selectFood(c){
  foodFilter=foodFilter===c?"":c;
  render();
}

function toggleFavorite(id){
  const r=recipes.find(x=>x.id===id);
  if(!r)return;
  r.favorite=!r.favorite;
  save();
  render();
}

/* =========================================================
   FAVORITAS
========================================================= */

function renderFavorites(root){

  const favs=recipes.filter(r=>r.favorite);

  root.innerHTML=`
  <main class="app">

    <header class="top">
      <div class="brand">
        FAVORITAS
        <span>RECETAS</span>
      </div>

      <button class="icon"
        onclick="page='settings';render()">
        ⚙
      </button>
    </header>

    <section class="section">

      ${
        favs.length
        ? favs.map(r=>`
          <button
            class="card"
            style="width:100%;text-align:left"
            onclick="openRecipe('${r.id}')">

            <div>
              <h3>${esc(r.name)}</h3>
              <div class="meta">
                ${esc(r.categories.join(" · "))}
                · ${r.time} MIN
                · ${esc(r.difficulty)}
              </div>
            </div>

            <div class="fav">♥</div>
          </button>
        `).join("")
        : `<div class="empty">NO HAY RECETAS FAVORITAS</div>`
      }

    </section>

    ${nav()}

  </main>`;
}

/* =========================================================
   RECETA
========================================================= */

function openRecipe(id){
  editing=recipes.find(x=>x.id===id);
  page="detail";
  render();
}

function renderDetail(root,r){

  const scale=r.servings||r.initial||4;
  const factor=scale/(r.initial||4);

  const possible=[];
  for(let n=r.min;n<=r.max;n+=2){
    possible.push(n);
  }

  root.innerHTML=`
  <main class="app detail">

    <button class="btn"
      onclick="page='recipes';render()">
      ← RECETAS
    </button>

    ${r.photo
      ? `<img class="recipe-img" src="${r.photo}">`
      :""
    }

    <h1>${esc(r.name)}</h1>

    <div class="meta">
      ${esc(r.categories.join(" · "))}
    </div>

    ${r.user
      ? `<div style="margin-top:10px">
          <span class="user-badge">
            CREADA POR ${esc(r.user)}
          </span>
        </div>`
      :""
    }

    <div class="yellowbox">

      COMENSALES:

      ${possible.map(n=>`
        <button
          style="
            font-weight:900;
            padding:5px 8px;
            text-decoration:${n===scale?"underline":"none"}
          "
          onclick="changeServings('${r.id}',${n})">
          ${n}
        </button>
      `).join(" · ")}

    </div>

    <div class="meta">
      ${r.time} MIN · ${esc(r.difficulty)}
    </div>

    <h2>INGREDIENTES</h2>

    <ul>
      ${r.ingredients.map(i=>`
        <li>
          <b>
            ${formatQty(Number(i.qty)*factor)}
            ${esc(i.unit)}
          </b>
          ${esc(i.name)}
        </li>
      `).join("")}
    </ul>

    <button
      class="btn primary"
      onclick="addSelected('${r.id}')">
      🛒 AÑADIR A LISTA
    </button>

    <h2>PREPARACIÓN</h2>

    ${r.steps.map((s,i)=>`
      <p>
        <b>${String(i+1).padStart(2,"0")}</b>
        ${esc(s)}
      </p>
    `).join("")}

    ${r.notes
      ? `
        <h2>NOTAS</h2>
        <div class="locked">${esc(r.notes)}</div>
      `
      :""
    }

    <div class="actions">
      <button class="btn"
        onclick="editRecipe('${r.id}')">
        EDITAR
      </button>

      <button class="btn"
        onclick="shareRecipe('${r.id}')">
        COMPARTIR
      </button>

      <button class="btn"
        onclick="deleteRecipe('${r.id}')">
        ELIMINAR
      </button>
    </div>

    ${nav()}

  </main>`;
}

function changeServings(id,n){
  const r=recipes.find(x=>x.id===id);
  if(!r)return;

  r.servings=n;
  save();
  renderDetail(document.getElementById("root"),r);
}

function editRecipe(id){
  const r=recipes.find(x=>x.id===id);
  if(r)openForm({...r,edit:true});
}

function deleteRecipe(id){

  const r=recipes.find(x=>x.id===id);
  if(!r)return;

  if(confirm("¿Enviar esta receta a la papelera?")){

    trash.push({
      ...r,
      deletedAt:new Date().toISOString()
    });

    recipes=recipes.filter(x=>x.id!==id);

    save();

    page="recipes";
    render();
  }
}

async function shareRecipe(id){

  const r=recipes.find(x=>x.id===id);

  const text=
`${r.name}

${r.time} min · ${r.difficulty}

INGREDIENTES
${r.ingredients.map(i=>`${i.qty} ${i.unit} ${i.name}`).join("\n")}

PREPARACIÓN
${r.steps.map((s,i)=>`${i+1}. ${s}`).join("\n")}`;

  if(navigator.share){
    try{
      await navigator.share({
        title:r.name,
        text
      });
    }catch(e){}
  }else{
    navigator.clipboard.writeText(text);
    alert("Receta copiada al portapapeles");
  }
}

function addSelected(id){

  const r=recipes.find(x=>x.id===id);
  if(!r)return;

  const factor=(r.servings||r.initial)/(r.initial||4);

  r.ingredients.forEach(i=>{

    const existing=list.find(x=>
      x.name.toLowerCase()===i.name.toLowerCase() &&
      x.unit===i.unit
    );

    if(existing){
      existing.qty=
        Number(existing.qty||0)+
        Number(i.qty||0)*factor;
    }else{
      list.push({
        name:i.name,
        qty:Number(i.qty||0)*factor,
        unit:i.unit,
        bought:false
      });
    }
  });

  save();
  alert("Ingredientes añadidos a la lista");
}

/* =========================================================
   LISTA DE COMPRA
========================================================= */

function renderList(root){

  root.innerHTML=`
  <main class="app">

    <header class="top">
      <div class="brand">
        LISTA
        <span>DE COMPRA</span>
      </div>

      <button class="icon"
        onclick="page='settings';render()">
        ⚙
      </button>
    </header>

    <section class="section">

      ${
        list.length
        ? list.map((x,i)=>`
          <div
            class="card"
            style="grid-template-columns:auto 1fr auto;align-items:center">

            <input
              type="checkbox"
              ${x.bought?"checked":""}
              onchange="toggleBought(${i})"
              style="width:22px;height:22px">

            <div>
              <h3 style="
                ${x.bought
                  ?"text-decoration:line-through;color:#888"
                  :""
                }
              ">
                ${esc(formatQty(x.qty))}
                ${esc(x.unit)}
                ${esc(x.name)}
              </h3>
            </div>

            <button
              class="btn"
              onclick="removeListItem(${i})">
              ×
            </button>

          </div>
        `).join("")
        : `<div class="empty">LISTA VACÍA</div>`
      }

    </section>

    <div class="actions">

      <button
        class="btn primary"
        onclick="addManualListItem()">
        + AÑADIR
      </button>

      <button
        class="btn"
        onclick="clearBought()">
        LIMPIAR COMPRADOS
      </button>

      <button
        class="btn"
        onclick="clearList()">
        VACIAR LISTA
      </button>

    </div>

    ${nav()}

  </main>`;
}

function toggleBought(i){
  list[i].bought=!list[i].bought;
  save();
  renderList(document.getElementById("root"));
}

function removeListItem(i){
  list.splice(i,1);
  save();
  renderList(document.getElementById("root"));
}

function clearBought(){
  list=list.filter(x=>!x.bought);
  save();
  renderList(document.getElementById("root"));
}

function clearList(){
  if(confirm("¿Vaciar toda la lista?")){
    list=[];
    save();
    renderList(document.getElementById("root"));
  }
}

function addManualListItem(){

  const name=prompt("Producto");

  if(!name)return;

  const qty=prompt("Cantidad","1");

  list.push({
    name,
    qty:qty||1,
    unit:"unidad",
    bought:false
  });

  save();
  renderList(document.getElementById("root"));
}

   AJUSTES
========================================================= */

/* =========================================================
   USUARIOS
========================================================= */

function manageUsers(){

  const name=prompt(
    "Usuarios actuales:\n\n"+
    users.join("\n")+
    "\n\nEscribe un nuevo usuario para añadirlo."
  );

  if(!name)return;

  const clean=name.trim().toUpperCase();

  if(clean && !users.includes(clean)){
    users.push(clean);
    save();
  }

  renderSettings(document.getElementById("root"));
}

/* =========================================================
   CATEGORÍAS
========================================================= */

function manageCategories(){

  const name=prompt(
    "Escribe una nueva categoría.\n\n"+
    "La categoría se añadirá como categoría personalizada."
  );

  if(!name)return;

  const clean=name.trim().toUpperCase();

  if(!clean)return;

  if(!categories.car.includes(clean)){
    categories.car.push(clean);
    save();
  }

  renderSettings(document.getElementById("root"));
}

/* =========================================================
   PAPELERA
========================================================= */

function manageTrash(){

  if(!trash.length){
    alert("La papelera está vacía.");
    return;
  }

  const names=trash.map((r,i)=>
    `${i+1}. ${r.name}`
  ).join("\n");

  const answer=prompt(
    "PAPELERA\n\n"+
    names+
    "\n\nEscribe el número para restaurar:"
  );

  if(!answer)return;

  const index=Number(answer)-1;

  if(
    Number.isInteger(index) &&
    trash[index]
  ){

    recipes.push(trash[index]);
    trash.splice(index,1);
    save();
  }

  renderSettings(document.getElementById("root"));
}

/* =========================================================
   CREAR / EDITAR RECETA
========================================================= */

function newMenu(){

  openForm({
    draft:true
  });
}

function openDraft(id){

  const d=drafts.find(x=>x.id===id);

  if(d)openForm(d);
}

function openForm(data={}){

  editing={
    id:data.id||uid(),
    name:data.name||"",
    categories:data.categories||[],
    min:data.min||2,
    initial:data.initial||2,
    max:data.max||12,
    time:data.time||"",
    difficulty:data.difficulty||"Fácil",
    ingredients:data.ingredients||[
      {
        qty:"",
        unit:"g",
        customUnit:"",
        name:""
      }
    ],
    steps:data.steps||[""],
    photo:data.photo||"",
    notes:data.notes||"",
    user:data.user||"",
    draft:data.draft||false,
    progress:data.progress||20,
    servings:data.servings||data.initial||2
  };

  step=1;

  renderForm();
}

function renderForm(){

  document.getElementById("root").innerHTML=
    formHTML();
}

function formHTML(){

}

/* =========================================================
   VALIDACIÓN
========================================================= */

function syncInfo(){

  const r=editing;

  r.user=
    document.getElementById("user")?.value ||
    r.user;

  r.name=
    document.getElementById("name")?.value ||
    r.name;

  r.initial=
    Number(document.getElementById("initial")?.value) ||
    r.initial;

  r.min=
    Number(document.getElementById("min")?.value) ||
    r.min;

  r.max=
    Number(document.getElementById("max")?.value) ||
    r.max;

  r.time=
    Number(document.getElementById("time")?.value) ||
    r.time;

  r.difficulty=
    document.getElementById("difficulty")?.value ||
    r.difficulty;
}

function nextStep(){

  if(step===1){

    syncInfo();

    if(!editing.user){
      alert("Selecciona qué usuario eres.");
      return;
    }

    if(!editing.name.trim()){
      alert("Escribe el nombre de la receta.");
      return;
    }

    if(editing.categories.length<1){
      alert("Selecciona al menos una categoría.");
      return;
    }

    if(editing.min<2){
      alert("El mínimo debe ser 2.");
      return;
    }

    if(editing.initial<editing.min){
      alert("Los comensales iniciales no pueden ser menores que el mínimo.");
      return;
    }

    if(editing.initial>editing.max){
      alert("Los comensales iniciales no pueden superar el máximo.");
      return;
    }

    if(editing.time<=0){
      alert("El tiempo total es obligatorio.");
      return;
    }
  }

  if(step===2){

    const invalid=
      editing.ingredients.some(i=>
        i.qty==="" ||
        i.qty===null ||
        !String(i.name||"").trim() ||
        (i.unit==="otra" && !String(i.customUnit||"").trim())
      );

    if(invalid){
      alert(
        "Cada ingrediente necesita cantidad y nombre."
      );
      return;
    }
  }

  if(step===3){

    if(editing.steps.some(s=>!String(s).trim())){
      alert("Completa todos los pasos de preparación.");
      return;
    }
  }

  step++;

  renderForm();
}

function toggleFormCat(c){

  editing.categories=
    editing.categories.includes(c)
    ? editing.categories.filter(x=>x!==c)
    : [...editing.categories,c];

  renderForm();
}

/* =========================================================
   GUARDAR BORRADOR
========================================================= */

function saveDraft(){

  if(step===1){
    syncInfo();
  }

  editing.progress=
    Math.max(
      20,
      Math.min(95,step*25)
    );

  editing.draft=true;

  drafts=
    drafts.filter(x=>x.id!==editing.id);

  drafts.push(editing);

  save();

  alert("Receta guardada como borrador.");

  page="recipes";
  render();
}

/* =========================================================
   GUARDAR RECETA
========================================================= */

function finalSave(){

  syncInfo();

  if(!editing.user){
    alert("Selecciona el usuario.");
    step=1;
    renderForm();
    return;
  }

  if(!editing.name.trim()){
    alert("La receta necesita un nombre.");
    step=1;
    renderForm();
    return;
  }

  if(editing.categories.length<1){
    alert("Selecciona al menos una categoría.");
    step=1;
    renderForm();
    return;
  }

  if(
    editing.ingredients.some(i=>
      i.qty==="" ||
      i.qty===null ||
      !String(i.name||"").trim() ||
      (i.unit==="otra" && !String(i.customUnit||"").trim())
    )
  ){
    alert("Revisa los ingredientes.");
    step=2;
    renderForm();
    return;
  }

  if(editing.steps.some(s=>!String(s).trim())){
    alert("Revisa la preparación.");
    step=3;
    renderForm();
    return;
  }

  editing.draft=false;
  editing.progress=100;
  editing.servings=editing.initial;

  recipes=
    recipes.filter(x=>x.id!==editing.id);

  recipes.push(editing);

  drafts=
    drafts.filter(x=>x.id!==editing.id);

  save();

  alert("Receta guardada correctamente.");

  page="recipes";
  render();
}

/* =========================================================
   FOTOS
========================================================= */

function photoFiles(){

  const input=
    document.getElementById("photoFile");

  input.removeAttribute("capture");
  input.click();
}

function photoCamera(){

  const input=
    document.getElementById("photoFile");

  input.setAttribute(
    "capture",
    "environment"
  );

  input.click();
}

function addPhotoLater(){

  editing.photo="";
  alert(
    "Perfecto. Puedes añadir la foto más adelante."
  );
}

function readPhoto(input){

  const f=input.files?.[0];

  if(!f)return;

  const reader=new FileReader();

  reader.onload=()=>{
    editing.photo=reader.result;
    renderForm();
  };

  reader.readAsDataURL(f);
}

   ARRANQUE
========================================================= */

if("serviceWorker" in navigator){
  try{
    navigator.serviceWorker.register("sw.js");
  }catch(e){}
}

render();
