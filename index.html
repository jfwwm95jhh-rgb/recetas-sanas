<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2c400">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>RECETAS SANAS</title>

<style>
:root{
  --yellow:#f2c400;
  --ink:#171717;
  --muted:#777;
  --line:#d8d8d8;
  --bg:#f7f7f5;
  --white:#fff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:inherit;
  cursor:pointer;
}

.app{
  max-width:1100px;
  margin:auto;
  min-height:100vh;
  padding:22px 18px 105px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:4px solid var(--ink);
  padding-bottom:14px;
}

.brand{
  font-size:29px;
  font-weight:900;
  letter-spacing:-1.5px;
  line-height:.9;
}

.brand span{
  display:block;
  font-size:18px;
  letter-spacing:1px;
}

.icon{
  font-size:25px;
  font-weight:900;
}

.search{
  margin:20px 0 12px;
  border:3px solid var(--ink);
  background:white;
  padding:14px 16px;
  font-weight:700;
  width:100%;
  outline:none;
}

.chips{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 15px;
  scrollbar-width:none;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  white-space:nowrap;
  border:2px solid var(--ink);
  padding:8px 12px;
  background:white;
  font-weight:800;
}

.chip.on{
  background:var(--yellow);
}

.section{
  margin-top:18px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section-title{
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px;
}

.count{
  font-weight:900;
  color:var(--muted);
}

.card{
  background:white;
  border:2px solid var(--ink);
  padding:14px;
  margin-bottom:10px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:12px;
}

.card h3{
  margin:0 0 7px;
  font-size:20px;
}

.meta{
  font-size:12px;
  font-weight:800;
  color:#666;
  text-transform:uppercase;
}

.fav{
  font-size:23px;
}

.fab{
  position:fixed;
  right:20px;
  bottom:76px;
  background:var(--yellow);
  border:3px solid var(--ink);
  width:58px;
  height:58px;
  font-size:34px;
  font-weight:900;
  box-shadow:4px 4px 0 var(--ink);
  z-index:6;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:3px solid var(--ink);
  display:flex;
  justify-content:center;
  z-index:5;
}

.nav button{
  width:25%;
  padding:12px 4px;
  font-size:11px;
  font-weight:900;
}

.nav button.on{
  background:var(--yellow);
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:10;
  display:flex;
  align-items:flex-end;
}

.sheet{
  background:var(--bg);
  width:100%;
  max-width:700px;
  margin:auto;
  padding:24px 18px 30px;
  border:3px solid var(--ink);
  max-height:92vh;
  overflow:auto;
}

.sheet h2{
  margin:0 0 18px;
  font-size:27px;
}

.field{
  margin:14px 0;
}

.field label{
  display:block;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:2px solid var(--ink);
  background:white;
  padding:12px;
  outline:none;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:18px;
  flex-wrap:wrap;
}

.btn{
  border:2px solid var(--ink);
  padding:12px 15px;
  font-weight:900;
  background:white;
}

.btn.primary{
  background:var(--yellow);
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:#666;
  font-weight:800;
}

.step{
  display:flex;
  gap:6px;
  margin-bottom:18px;
}

.step b{
  background:var(--ink);
  color:white;
  padding:6px 9px;
}

.ingredient{
  display:grid;
  grid-template-columns:75px 125px 1fr 34px;
  gap:6px;
  margin-bottom:7px;
  align-items:start;
}

.ingredient input,
.ingredient select{
  border:2px solid var(--ink);
  padding:9px;
  background:white;
  width:100%;
  min-width:0;
}

.custom-unit{
  grid-column:2;
  margin-top:-2px;
}

.custom-unit input{
  width:100%;
}

.recipe-img{
  width:100%;
  max-height:280px;
  object-fit:cover;
  border:2px solid var(--ink);
  margin-bottom:15px;
}

.detail h1{
  font-size:34px;
  line-height:.95;
  margin:5px 0 10px;
}

.yellowbox{
  background:var(--yellow);
  border:2px solid var(--ink);
  padding:13px;
  margin:12px 0;
  font-weight:900;
}

.detail ul{
  padding-left:20px;
}

.detail li{
  margin:8px 0;
}

.locked{
  border:2px dashed var(--ink);
  padding:12px;
  background:#fff;
}

.photo-preview{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border:2px solid var(--ink);
  margin-top:10px;
}

.fav-big{
  font-size:28px;
  font-weight:900;
}

@media(max-width:600px){

  .grid2{
    grid-template-columns:1fr 1fr;
  }

  .grid3{
    grid-template-columns:1fr 1fr 1fr;
  }

  .ingredient{
    grid-template-columns:70px 110px 1fr 32px;
  }

}

@media(min-width:700px){

  .app{
    padding:30px 34px 110px;
  }

  .overlay{
    align-items:center;
  }

  .sheet{
    border:3px solid var(--ink);
  }

}
</style>
</head>

<body>

<div id="root"></div>

<script>

/* =========================
   DATOS
========================= */

const CATS = {
  momento:[
    "DESAYUNO",
    "ALMUERZO",
    "COMIDA",
    "MERIENDA",
    "CENA"
  ],

  tipo:[
    "ENSALADA",
    "PASTA",
    "ARROZ",
    "LEGUMBRES",
    "SOPA / CREMA",
    "CARNE",
    "PESCADO",
    "MARISCO",
    "HUEVOS",
    "VERDURAS",
    "PIZZA",
    "BOCADILLOS",
    "ENTRANTES",
    "GUARNICIONES",
    "POSTRES",
    "REPOSTERÍA"
  ],

  car:[
    "SALUDABLE",
    "RÁPIDA",
    "ALTA EN PROTEÍNA",
    "VEGETARIANA",
    "VEGANA",
    "ECONÓMICA",
    "PARA INVITADOS"
  ]
};

const units = [
  "g",
  "kg",
  "ml",
  "l",
  "unidad",
  "cucharadita",
  "cucharada",
  "pizca",
  "al gusto",
  "OTRA / ESCRIBIR"
];

let recipes = JSON.parse(localStorage.getItem("rs_recipes") || "[]");
let drafts = JSON.parse(localStorage.getItem("rs_drafts") || "[]");
let list = JSON.parse(localStorage.getItem("rs_list") || "[]");

let page = "recipes";
let query = "";
let filters = [];
let editing = null;
let step = 1;


/* =========================
   FUNCIONES GENERALES
========================= */

function save(){

  localStorage.setItem(
    "rs_recipes",
    JSON.stringify(recipes)
  );

  localStorage.setItem(
    "rs_drafts",
    JSON.stringify(drafts)
  );

  localStorage.setItem(
    "rs_list",
    JSON.stringify(list)
  );
}


function esc(s = ""){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );
}


function cats(){

  return [
    ...CATS.momento,
    ...CATS.tipo,
    ...CATS.car
  ];
}


function getUnit(i){

  if(i.unit === "OTRA / ESCRIBIR"){
    return i.customUnit || "";
  }

  return i.unit || "";
}


function formatQty(n){

  const number = Number(n);

  if(!Number.isFinite(number)){
    return String(n);
  }

  if(Number.isInteger(number)){
    return number;
  }

  return (
    Math.round(number * 100) / 100
  )
  .toString()
  .replace(".",",");
}


/* =========================
   NAVEGACIÓN
========================= */

function nav(){

  return `
    <nav class="nav">

      <button
        class="${page === "recipes" ? "on" : ""}"
        onclick="page='recipes';filters=[];render()">
        RECETAS
      </button>

      <button
        class="${filters.includes("__FAVORITAS__") ? "on" : ""}"
        onclick="showFavorites()">
        ♡ FAVORITAS
      </button>

      <button
        class="${page === "list" ? "on" : ""}"
        onclick="page='list';render()">
        🛒 LISTA
      </button>

      <button
        class="${page === "settings" ? "on" : ""}"
        onclick="page='settings';render()">
        ⚙ AJUSTES
      </button>

    </nav>
  `;
}


function showFavorites(){

  page = "recipes";
  filters = ["__FAVORITAS__"];
  query = "";
  render();
}


/* =========================
   PANTALLA PRINCIPAL
========================= */

function render(){

  const root = document.getElementById("root");

  if(page === "detail"){
    return renderDetail(root, editing);
  }

  if(page === "list"){
    return renderList(root);
  }

  if(page === "settings"){
    return renderSettings(root);
  }


  let filtered = recipes.filter(r => {

    const matchesQuery =
      !query ||
      JSON.stringify(r)
        .toLowerCase()
        .includes(query.toLowerCase());


    const favoriteFilter =
      filters.includes("__FAVORITAS__")
        ? r.favorite === true
        : true;


    const categoryFilters =
      filters.filter(f => f !== "__FAVORITAS__");


    const matchesCategories =
      categoryFilters.length === 0 ||
      categoryFilters.some(
        f => r.categories.includes(f)
      );


    return (
      matchesQuery &&
      favoriteFilter &&
      matchesCategories
    );

  });


  root.innerHTML = `

    <main class="app">

      <header class="top">

        <div class="brand">
          RECETAS
          <span>SANAS</span>
        </div>

        <button
          class="icon"
          onclick="page='settings';render()">
          •••
        </button>

      </header>


      <input
        class="search"
        placeholder="BUSCAR RECETAS O INGREDIENTES"
        value="${esc(query)}"
        oninput="query=this.value;render()">


      <div class="chips">

        <button
          class="chip ${
            filters.length === 0 ? "on" : ""
          }"
          onclick="filters=[];render()">
          TODAS
        </button>

        ${[...CATS.momento,...CATS.tipo]
          .map(c => `

            <button
              class="chip ${
                filters.includes(c) ? "on" : ""
              }"
              onclick="toggleFilter('${esc(c)}')">
              ${esc(c)}
            </button>

          `)
          .join("")}

      </div>


      ${
        drafts.length
        ?
        `
        <section class="section">

          <div class="section-head">

            <div class="section-title">
              BORRADORES — ${drafts.length}
            </div>

          </div>

          ${
            drafts.map(d => `

              <button
                class="card"
                style="width:100%;text-align:left"
                onclick="openDraft('${d.id}')">

                <div>

                  <h3>
                    ${esc(
                      d.name ||
                      "RECETA SIN TÍTULO"
                    )}
                  </h3>

                  <div
                    style="
                      height:9px;
                      background:#ddd;
                      margin-top:9px;
                    ">

                    <i
                      style="
                        display:block;
                        height:100%;
                        width:${d.progress || 20}%;
                        background:var(--yellow);
                      ">
                    </i>

                  </div>

                </div>

                <b>
                  ${d.progress || 20}%
                </b>

              </button>

            `).join("")
          }

        </section>
        `
        :
        ""
      }


      <section class="section">

        <div class="section-head">

          <div class="section-title">
            RECETAS
          </div>

          <div class="count">
            ${filtered.length}
          </div>

        </div>


        ${
          filtered.length
          ?

          filtered.map(r => `

            <div
              class="card"
              style="width:100%;text-align:left">

              <button
                style="text-align:left"
                onclick="openRecipe('${r.id}')">

                <h3>
                  ${esc(r.name)}
                </h3>

                <div class="meta">
                  ${esc(r.categories.join(" · "))}
                  · ${r.time} MIN
                  · ${esc(r.difficulty)}
                </div>

              </button>


              <button
                class="fav"
                onclick="toggleFavorite('${r.id}')">

                ${r.favorite ? "♥" : "♡"}

              </button>

            </div>

          `).join("")

          :

          `
          <div class="empty">
            NO HAY RECETAS
          </div>
          `
        }

      </section>


      <button
        class="fab"
        onclick="newMenu()">
        +
      </button>


      ${nav()}

    </main>
  `;
}


function toggleFilter(c){

  if(filters.includes("__FAVORITAS__")){
    filters = [];
  }

  if(filters.includes(c)){
    filters = filters.filter(
      x => x !== c
    );
  }else{
    filters.push(c);
  }

  render();
}


function toggleFavorite(id){

  const r = recipes.find(
    x => x.id === id
  );

  if(!r) return;

  r.favorite = !r.favorite;

  save();
  render();
}


/* =========================
   RECETAS
========================= */

function newMenu(){

  openForm({
    draft:true
  });
}


function openDraft(id){

  const d = drafts.find(
    x => x.id === id
  );

  if(d){
    openForm(d);
  }
}


function openRecipe(id){

  editing = recipes.find(
    x => x.id === id
  );

  page = "detail";

  render();
}


function renderDetail(root,r){

  if(!r){
    page = "recipes";
    render();
    return;
  }


  const scale =
    r.servings ||
    r.initial ||
    4;

  const factor =
    scale /
    (r.initial || 4);


  root.innerHTML = `

    <main class="app detail">

      <button
        class="btn"
        onclick="page='recipes';render()">
        ← RECETAS
      </button>


      ${
        r.photo
        ?
        `<img
          class="recipe-img"
          src="${r.photo}">`
        :
        ""
      }


      <h1>
        ${esc(r.name)}
      </h1>


      <div class="meta">
        ${esc(r.categories.join(" · "))}
      </div>


      <div class="yellowbox">

        COMENSALES:

        ${
          [2,4,6,8,10,12]
          .filter(
            n =>
              n >= r.min &&
              n <= r.max
          )
          .map(n => `

            <button
              style="
                font-weight:900;
                padding:5px 8px;
                text-decoration:${
                  n === scale
                  ? "underline"
                  : "none"
                };
              "
              onclick="changeServings('${r.id}',${n})">

              ${n}

            </button>

          `).join(" · ")
        }

      </div>


      <div class="meta">
        ${r.time} MIN ·
        ${esc(r.difficulty)}
      </div>


      <h2>
        INGREDIENTES
      </h2>


      <ul>

        ${
          r.ingredients.map(i => `

            <li>

              <b>
                ${formatQty(
                  Number(i.qty) * factor
                )}
                ${esc(getUnit(i))}
              </b>

              ${esc(i.name)}

            </li>

          `).join("")
        }

      </ul>


      <button
        class="btn primary"
        onclick="addSelected('${r.id}')">

        🛒 AÑADIR A LISTA

      </button>


      <h2>
        PREPARACIÓN
      </h2>


      ${
        r.steps.map((s,i) => `

          <p>
            <b>
              ${String(i+1).padStart(2,"0")}
            </b>
            ${esc(s)}
          </p>

        `).join("")
      }


      ${
        r.notes
        ?
        `
        <h2>
          NOTAS
        </h2>

        <div class="locked">
          ${esc(r.notes)}
        </div>
        `
        :
        ""
      }


      <div class="actions">

        <button
          class="btn"
          onclick="toggleFavorite('${r.id}')">

          ${r.favorite
            ? "♥ QUITAR FAVORITA"
            : "♡ AÑADIR A FAVORITAS"}

        </button>


        <button
          class="btn"
          onclick="editRecipe('${r.id}')">

          EDITAR

        </button>


        <button
          class="btn"
          onclick="shareRecipe('${r.id}')">

          COMPARTIR

        </button>


        <button
          class="btn"
          onclick="deleteRecipe('${r.id}')">

          ELIMINAR

        </button>

      </div>


      ${nav()}

    </main>
  `;
}


function changeServings(id,n){

  const r = recipes.find(
    x => x.id === id
  );

  if(!r) return;

  r.servings = n;

  save();

  renderDetail(
    document.getElementById("root"),
    r
  );
}


function editRecipe(id){

  const r = recipes.find(
    x => x.id === id
  );

  if(r){
    openForm({
      ...r,
      edit:true
    });
  }
}


function deleteRecipe(id){

  if(
    confirm("¿Eliminar receta?")
  ){

    recipes =
      recipes.filter(
        r => r.id !== id
      );

    save();

    page = "recipes";

    render();
  }
}


function shareRecipe(id){

  const r = recipes.find(
    x => x.id === id
  );

  if(!r) return;


  const text =
`${r.name}
${r.time} min · ${r.difficulty}

INGREDIENTES
` +
r.ingredients
  .map(
    i =>
      `${i.qty} ${getUnit(i)} ${i.name}`
  )
  .join("\n") +
`

PREPARACIÓN
` +
r.steps
  .map(
    (s,i) =>
      `${i+1}. ${s}`
  )
  .join("\n");


  if(navigator.share){

    navigator.share({
      title:r.name,
      text
    });

  }else if(navigator.clipboard){

    navigator.clipboard
      .writeText(text)
      .then(
        () =>
          alert(
            "Receta copiada al portapapeles"
          )
      );

  }

}


function addSelected(id){

  const r = recipes.find(
    x => x.id === id
  );

  if(!r) return;


  const factor =
    (r.servings || r.initial || 4) /
    (r.initial || 4);


  r.ingredients.forEach(i => {

    list.push({
      name:i.name,
      qty:Number(i.qty || 0) * factor,
      unit:getUnit(i),
      bought:false
    });

  });


  save();

  alert(
    "Ingredientes añadidos a la lista"
  );
}


/* =========================
   LISTA DE COMPRA
========================= */

function renderList(root){

  let grouped = {};

  list.forEach((x,i) => {

    const key =
      x.name.toLowerCase() +
      "|" +
      x.unit;

    if(!grouped[key]){
      grouped[key] = [];
    }

    grouped[key].push(i);

  });


  root.innerHTML = `

    <main class="app">

      <header class="top">

        <div class="brand">
          LISTA
          <span>DE COMPRA</span>
        </div>

      </header>


      <section class="section">

        ${
          list.length

          ?

          Object.values(grouped)
          .map(ids => {

            const x =
              list[ids[0]];

            const qty =
              ids.reduce(
                (s,i) =>
                  s +
                  Number(
                    list[i].qty || 0
                  ),
                0
              );


            const bought =
              ids.every(
                i =>
                  list[i].bought
              );


            return `

              <div class="card">

                <button
                  style="text-align:left"
                  onclick="
                    ids.forEach(i =>
                      list[i].bought =
                        !list[i].bought
                    );
                    save();
                    renderList(
                      document.getElementById('root')
                    );
                  ">

                  <h3
                    style="
                      ${
                        bought
                        ?
                        "text-decoration:line-through;color:#888"
                        :
                        ""
                      }
                    ">

                    ${esc(formatQty(qty))}
                    ${esc(x.unit)}
                    ${esc(x.name)}

                  </h3>

                </button>

              </div>

            `;

          })
          .join("")

          :

          `
          <div class="empty">
            LISTA VACÍA
          </div>
          `
        }

      </section>


      <div class="actions">

        <button
          class="btn"
          onclick="addManualProduct()">

          + AÑADIR

        </button>


        <button
          class="btn"
          onclick="
            list =
              list.filter(
                x => !x.bought
              );
            save();
            renderList(
              document.getElementById('root')
            );
          ">

          LIMPIAR COMPRADOS

        </button>

function addManualProduct(){

  const name =
    prompt("Producto");

  if(!name) return;


  const qty =
    prompt("Cantidad","1");


  const unit =
    prompt("Unidad","unidad");


  list.push({
    name,
    qty:Number(qty) || 1,
    unit:unit || "unidad",

  });


  save();

  renderList(
    document.getElementById("root")
  );
}

          ? "REVISAR"
          : "SIGUIENTE"

/* =========================
   VALIDACIÓN / PASOS
========================= */

function syncInfo(){

  const r = editing;

  const name =
    document.getElementById("name");

  const min =
    document.getElementById("min");

  const initial =
    document.getElementById("initial");

  const max =
    document.getElementById("max");

  const time =
    document.getElementById("time");

  const difficulty =
    document.getElementById("difficulty");


  if(name){
    r.name = name.value.trim();
  }

  if(min){
    r.min = Number(min.value);
  }

  if(initial){
    r.initial =
      Number(initial.value);
  }

  if(max){
    r.max =
      Number(max.value);
  }

  if(time){
    r.time =
      Number(time.value);
  }

  if(difficulty){
    r.difficulty =
      difficulty.value;
  }
}


function next(n){

  if(step === 1){
    syncInfo();
  }


  if(
    n === 2 &&
    (
      !editing.name ||
      editing.categories.length < 1 ||
      editing.initial < editing.min ||
      editing.initial > editing.max ||
      editing.time <= 0
    )
  ){

    alert(
      "Completa correctamente la información obligatoria."
    );

    return;
  }


  if(
    n === 3 &&
    editing.ingredients.some(
      i =>
        !i.name.trim() ||
        i.qty === ""
    )
  ){

    alert(
      "Cada ingrediente necesita nombre y cantidad."
    );

    return;
  }


  if(
    n === 4 &&
    editing.steps.some(
      s => !s.trim()
    )
  ){

    alert(
      "Todos los pasos deben tener texto."
    );

    return;
  }


  step = n;

  renderForm();
}


function renderForm(){

  document.getElementById(
    "root"
  ).innerHTML =
    formHTML();
}


function toggleFormCat(c){

  editing.categories =
    editing.categories.includes(c)

    ?

    editing.categories.filter(
      x => x !== c
    )

    :

    [
      ...editing.categories,
      c
    ];


  renderForm();
}


/* =========================
   BORRADORES
========================= */

function saveDraft(){

  if(step === 1){
    syncInfo();
  }


  editing.progress =
    Math.max(
      20,
      step * 25
    );


  editing.draft = true;


  drafts =
    drafts.filter(
      x => x.id !== editing.id
    );


  drafts.push(editing);

  save();


  alert(
    "Guardado como borrador"
  );


  page = "recipes";

  render();
}


/* =========================
   GUARDAR RECETA
========================= */

function finalSave(){

  if(
    !editing.name ||
    editing.categories.length < 1
  ){

    alert(
      "Revisa la información obligatoria."
    );

    return;
  }


  if(
    editing.ingredients.some(
      i =>
        !i.name.trim() ||
        i.qty === ""
    )
  ){

    alert(
      "Revisa los ingredientes."
    );

    return;
  }


  if(
    editing.steps.some(
      s => !s.trim()
    )
  ){

    alert(
      "Revisa los pasos."
    );

    return;
  }


  editing.draft = false;

  editing.servings =
    editing.initial;


  recipes =
    recipes.filter(
      x => x.id !== editing.id
    );


  recipes.push(editing);


  drafts =
    drafts.filter(
      x => x.id !== editing.id
    );


  save();


  page = "recipes";

  render();
}


/* =========================
   FOTOS
========================= */

function photoFiles(){

  const input =
    document.getElementById(
      "photoFile"
    );

  if(input){
    input.removeAttribute("capture");
    input.click();
  }
}


function photoCamera(){

  const input =
    document.getElementById(
      "photoFile"
    );

  if(input){

    input.setAttribute(
      "capture",
      "environment"
    );

    input.click();
  }
}


function readPhoto(input){

  const f =
    input.files &&
    input.files[0];

  if(!f) return;


  const rd =
    new FileReader();


  rd.onload = () => {

    editing.photo =
      rd.result;

    renderForm();

  };


  rd.readAsDataURL(f);
}
